{{/* Every heading carries a link to itself, shown on hover and on keyboard
     focus. These posts are long and sectioned, and the useful thing to send
     someone is usually one section of one -- "look at what happened to his
     p99" -- not the post. */}}
<h{{ .Level }} id="{{ .Anchor }}">
  {{- .Text -}}
  <a class="heading-anchor" href="#{{ .Anchor }}" aria-label="Link to this section">#</a>
</h{{ .Level }}>
