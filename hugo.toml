baseURL = "https://blog.cs2680.com/"
title = "CS2680 Student Blog"
copyright = "&copy; 2026 The President and Fellows of Harvard College"
locale = "en"
DefaultContentLanguage = "en"
enableInlineShortcodes = true
enableRobotsTXT = true
summaryLength = 40
# A post dated in the future is still published. Hugo hides future-dated content
# by default, which would silently drop a submission whose date was mistyped or
# written in a timezone ahead of the build machine's.
buildFuture = true
# prevent build failures when using Hugo's Instagram shortcode due to deprecated Instagram API.
# See https://github.com/gohugoio/hugo/issues/7228#issuecomment-714490456
ignoreErrors = ["error-remote-getjson"]

# ------------------------------
# The look comes from assets/css/course.css, a verbatim copy of
# https://cs2680.com/css/main.css, plus assets/css/blog.css for the
# blog's own components. There is no theme directory.
# ------------------------------

[params]
  # The course, in two pieces, because the two places it appears want
  # different amounts of it. The code goes under the brand in the header,
  # where the full name would not fit on a phone; the name goes under the
  # site title on the home page, where the code is already in the line above.
  courseCode = "CS2680"
  courseName = "Modern AI Systems"
  term = "Fall 2026"
  tagline = "Student Blog"
  courseURL = "https://cs2680.com/"
  description = "Student writing on profiling and optimizing LLM agent systems, from CS2680 Modern AI Systems at Harvard SEAS."
  keywords = ["AI Systems", "MLSys", "LLM", "agents", "inference optimization", "CS2680"]
  # The offering the site currently leads with. Posts live under the year they
  # were written for -- /2026/assignment3/jdoe/ -- so nothing published in one
  # year moves when the next year's posts arrive. To roll the site over, add
  # content/2027/ and change this, `term`, and the "Fall 2026" menu URL below.
  currentYear = "2026"
  # KaTeX everywhere; the cost and latency arithmetic shows up in most posts.
  math = true

[taxonomies]
  author = "authors"
  tag = "tags"

# needed to render raw HTML (e.g. <sub>, <sup>, <kbd>, <mark>)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    lineNumbersInTable = true
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[menu]

  # Deliberately three items. The assignments are one click from the home page
  # and from /2026/; the publishing guide, the author index and the tag index
  # are reached from the front page, from a byline, and from the footer, which
  # lists every page the bar leaves out.
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 10
  [[menu.main]]
    identifier = "year"
    name = "Fall 2026"
    url = "/2026/"
    weight = 20
  [[menu.main]]
    identifier = "course"
    name = "Course site"
    url = "https://cs2680.com/"
    weight = 30

[privacy]

  [privacy.vimeo]
    disabled = false
    simple = true

  [privacy.x]
    disabled = false
    enableDNT = true
    simple = true

  [privacy.instagram]
    disabled = false
    simple = true

  [privacy.youtube]
    disabled = false
    privacyEnhanced = true

[services]

  [services.instagram]
    disableInlineCSS = true

  [services.x]
    disableInlineCSS = true
