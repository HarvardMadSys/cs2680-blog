<rect x="40" y="306" width="5" height="12" fill="#6B7075"/><text x="52" y="316" font-size="11.5" fill="#6B7075">Each gray bar is one step of Task A on the GPU. Each step produces one token (the tick below it).</text>
<line x1="40" y1="338" x2="640" y2="338" stroke="#D5D8DB"/>
<text x="40" y="362" font-size="12.5" fill="#3B4147">Alone, Task A writes about 168 tokens per second.</text>
<text x="40" y="382" font-size="12.5" fill="#3B4147">With long prompts from other tasks overlapping, it averages about 55.</text>
