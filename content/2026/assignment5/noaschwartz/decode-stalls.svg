" width="5" height="30" fill="#6B7075"/><rect x="560" y="148" width="5" height="30" fill="#6B7075"/><rect x="566" y="148" width="5" height="30" fill="#6B7075"/><rect x="572" y="148" width="5" height="30" fill="#6B7075"/><rect x="578" y="148" width="5" height="30" fill="#6B7075"/><rect x="584" y="148" width="5" height="30" fill="#6B7075"/><rect x="590" y="148" width="5" height="30" fill="#6B7075"/><rect x="596" y="148" width="5" height="30" fill="#6B7075"/><rect x="602" y="148" width="5" height="30" fill="#6B7075"/><rect x="608" y="148" width="5" height="30" fill="#6B7075"/><rect x="614" y="148" width="5" height="30" fill="#6B7075"/><rect x="620" y="148" width="5" height="30" fill="#6B7075"/><rect x="626" y="148" width="5" height="30" fill="#6B7075"/><rect x="632" y="148" width="5" height="30" fill="#6B7075"/>
