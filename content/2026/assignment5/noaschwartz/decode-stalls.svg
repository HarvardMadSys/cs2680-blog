<line x1="40" y1="318" x2="640" y2="318" stroke="#D5D8DB"/>
<text x="40" y="342" font-size="12.5" fill="#3B4147">Alone, Task A writes about 168 tokens per second.</text>
<text x="40" y="362" font-size="12.5" fill="#3B4147">With long prompts from other tasks overlapping, it averages about 55.</text>
