<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 396" width="680" height="396" role="img" font-family="'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Another task's prefill takes the GPU away from this task</title>
<desc>Three lanes over time. Task B sends a long prompt and writes no tokens until its prefill is done. The GPU is shared and does one step at a time: normally every step is Task A writing one token, but while Task B's long prompt is being prefilled, big prefill chunks are fitted in between Task A's steps. Task A gets one token per step, so its tokens come out fast before and after Task B's prompt and slowly while it is on the GPU. With overlap like this Task A averages about 55 tokens per second, compared with about 168 when it runs alone.</desc>
<rect width="680" height="396" fill="#FFFFFF"/>
<text x="40" y="26" font-size="15" fill="#3B4147" font-weight="700">What happens when another task sends a long prompt</text>
<text x="40" y="46" font-size="12.5" fill="#6B7075">The GPU is shared, so Task A's tokens can only come out in the gaps between Task B's prefill.</text>
<text x="40" y="92" font-size="12.5" fill="#3B4147" font-weight="700">Task B</text>
<text x="40" y="106" font-size="10.5" fill="#6B7075">another task</text>
<rect x="260.5" y="78.5" width="239" height="29" fill="#FFFFFF" stroke="#8C1515" stroke-width="1.5"/>
<text x="380" y="97" font-size="12" fill="#8C1515" text-anchor="middle">sends a long prompt, which needs a prefill</text>
<text x="508" y="91" font-size="11" fill="#6B7075">no tokens yet:</text>
<text x="508" y="105" font-size="11" fill="#6B7075">still reading its prompt</text>
<path d="M260 108 V150 M500 108 V150" stroke="#8C1515" stroke-width="1" stroke-dasharray="3 3"/>
<text x="40" y="160" font-size="12.5" fill="#3B4147" font-weight="700">GPU</text>
<text x="40" y="174" font-size="10" fill="#6B7075">shared by all tasks</text>
