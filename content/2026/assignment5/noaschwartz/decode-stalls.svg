<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" font-family="'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>A large prefill stalls other tasks decoding</title>
<desc>Two timelines of one task generating tokens. Alone on the server it generates tokens steadily at about 168 tokens per second. When another task sends a large prefill, the first task stops generating until the prefill is done, so across overlapping tasks it averages about 55 tokens per second.</desc>
