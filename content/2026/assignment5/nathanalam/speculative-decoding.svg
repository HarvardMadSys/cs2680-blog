<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <style>.title{font:700 30px system-ui,sans-serif;fill:#172033}.sub{font:16px system-ui,sans-serif;fill:#58657a}.label{font:700 18px system-ui,sans-serif;fill:#172033}.body{font:15px system-ui,sans-serif;fill:#334155}.small{font:13px system-ui,sans-serif;fill:#64748b}.line{stroke:#94a3b8;stroke-width:3;fill:none}.bad{fill:#fff1f2;stroke:#fda4af}.good{fill:#ecfdf5;stroke:#86efac}.red{fill:#be123c}.green{fill:#15803d}.amber{fill:#b45309}</style>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="60" y="58" class="title">Speculative decoding: a clever idea with the wrong division of labor</text>
  <text x="60" y="88" class="sub">The file in the prompt was used as a draft, inspired by Cursor’s fast-apply idea—but both roles confused the same model.</text>
  <rect x="60" y="135" width="420" height="250" rx="18" class="good"/><text x="90" y="178" class="label">The attractive idea</text>
  <rect x="100" y="220" width="150" height="80" rx="12" fill="#fff" stroke="#86efac"/><text x="127" y="250" class="label">FILE TEXT</text><text x="115" y="277" class="small">draft tokens</text>
  <path d="M260 260 H330" class="line" marker-end="url(#arrow)"/><rect x="345" y="220" width="100" height="80" rx="12" fill="#fff" stroke="#86efac"/><text x="365" y="250" class="label">VERIFY</text><text x="360" y="277" class="small">keep match</text>
  <text x="100" y="340" class="body">Copied context should cost fewer decode steps.</text>
  <rect x="530" y="135" width="610" height="250" rx="18" class="bad"/><text x="560" y="178" class="label">What actually happened</text>
  <rect x="575" y="220" width="170" height="90" rx="12" fill="#fff" stroke="#fda4af"/><text x="603" y="252" class="label">ONE MODEL</text><text x="600" y="280" class="small">planner + drafter?</text>
  <path d="M755 245 C825 190 880 190 935 245" class="line" marker-end="url(#arrow)"/><text x="820" y="200" font-size="34" class="red">?</text>
  <path d="M935 285 C875 335 820 335 755 285" class="line" marker-end="url(#arrow)"/><text x="820" y="350" font-size="34" class="red">?</text>
  <text x="965" y="252" class="body">drafts uncertain</text><text x="965" y="280" class="body">verification confused</text>
  <text x="560" y="345" class="body">No model was specialized for fast drafting or planning.</text>
  <text x="60" y="445" class="label">Systems-level result</text>
  <rect x="60" y="475" width="500" height="140" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="95" y="520" class="body">Base configuration</text><text x="95" y="563" font-size="30" class="green">✓</text><text x="135" y="563" class="body">high capacity for many long conversations</text><text x="95" y="592" class="small">~21 running requests</text>
  <rect x="640" y="475" width="500" height="140" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="675" y="520" class="body">Speculative variant</text><text x="675" y="563" font-size="30" class="red">✗</text><text x="715" y="563" class="body">faster in a narrow benchmark</text><text x="675" y="592" class="small">capacity fell to about 3 running requests</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
</svg>
