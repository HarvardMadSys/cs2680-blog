<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <style>.title{font:700 30px system-ui,sans-serif;fill:#172033}.sub{font:16px system-ui,sans-serif;fill:#58657a}.label{font:700 18px system-ui,sans-serif;fill:#172033}.body{font:15px system-ui,sans-serif;fill:#334155}.small{font:13px system-ui,sans-serif;fill:#64748b}.line{stroke:#94a3b8;stroke-width:3;fill:none}.bad{fill:#fff1f2;stroke:#fda4af}.good{fill:#ecfdf5;stroke:#86efac}.red{fill:#be123c}.green{fill:#15803d}.amber{fill:#b45309}</style>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="60" y="58" class="title">N-gram speculative decoding cut concurrency without helping edits</text>
  <text x="60" y="88" class="sub">SGLang’s n-gram mode drafts from prompt context (no separate draft model), but targeted agent edits rarely matched.</text>
  <rect x="60" y="135" width="490" height="250" rx="18" class="good"/><text x="90" y="178" class="label">The attractive idea (n-gram mode)</text>
  <rect x="95" y="220" width="175" height="85" rx="12" fill="#fff" stroke="#86efac"/><text x="115" y="252" class="label">EXISTING CODE</text><text x="112" y="280" class="small">n-gram draft tokens</text>
  <path d="M280 262 H340" class="line" marker-end="url(#arrow)"/><rect x="355" y="220" width="165" height="85" rx="12" fill="#fff" stroke="#86efac"/><text x="370" y="252" class="label">TARGET MODEL</text><text x="378" y="280" class="small">verifies in parallel</text>
  <text x="95" y="345" class="body">Works well when rewriting whole files verbatim.</text>
  <rect x="590" y="135" width="550" height="250" rx="18" class="bad"/><text x="620" y="178" class="label">What actually happened</text>
  <rect x="625" y="220" width="190" height="85" rx="12" fill="#fff" stroke="#fda4af"/><text x="645" y="252" class="label">TARGETED EDITS</text><text x="645" y="280" class="small">novel, position-sensitive</text>
  <path d="M825 262 H885" class="line" marker-end="url(#arrow)"/><rect x="900" y="220" width="205" height="85" rx="12" fill="#fff" stroke="#fda4af"/><text x="920" y="252" class="label red">LOW REUSE</text><text x="920" y="280" class="small">verification tax dominates</text>
  <text x="625" y="345" class="body">Extra verification buffers also shrank KV-cache capacity.</text>
  <text x="60" y="445" class="label">Systems-level result</text>
  <rect x="60" y="475" width="500" height="145" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="95" y="518" class="label">Base configuration</text><text x="95" y="560" font-size="30" class="green">✓</text><text x="135" y="560" class="body">high capacity for parallel agent rollouts</text><text x="95" y="592" class="body">~21 running requests</text>
  <rect x="640" y="475" width="500" height="145" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="675" y="518" class="label">N-gram speculative mode</text><text x="675" y="560" font-size="30" class="red">✗</text><text x="715" y="560" class="body">low n-gram reuse + less KV cache per request</text><text x="675" y="592" class="body">~3 running requests</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
</svg>
