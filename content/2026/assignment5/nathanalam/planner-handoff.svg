<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <style>.title{font:700 30px system-ui,sans-serif;fill:#172033}.sub{font:16px system-ui,sans-serif;fill:#58657a}.label{font:700 18px system-ui,sans-serif;fill:#172033}.body{font:15px system-ui,sans-serif;fill:#334155}.small{font:13px system-ui,sans-serif;fill:#64748b}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.bad{fill:#fff7ed;stroke:#fdba74}.good{fill:#ecfdf5;stroke:#86efac}.line{stroke:#94a3b8;stroke-width:3;fill:none}.red{fill:#be123c}.green{fill:#15803d}.amber{fill:#b45309}</style>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="60" y="58" class="title">The planner handoff added a layer—but not useful momentum</text>
  <text x="60" y="88" class="sub">A plan made after only a little exploration was handed to a slower solver that had to rediscover the task.</text>
  <rect x="60" y="135" width="700" height="235" rx="18" class="bad"/>
  <text x="90" y="175" class="label">Fancy handoff: expert planner → standard solver</text>
  <rect x="100" y="220" width="190" height="85" rx="14" class="box"/><text x="132" y="250" class="label">EXPERT</text><text x="122" y="278" class="small">2–3 exploratory steps</text>
  <path d="M300 260 C380 200 430 200 500 260" class="line" marker-end="url(#arrow)"/><text x="350" y="196" font-size="34" class="amber">?</text><text x="405" y="220" class="small">premature plan</text>
  <rect x="510" y="220" width="190" height="85" rx="14" class="box"/><text x="535" y="250" class="label">STANDARD</text><text x="530" y="278" class="small">follows stale context</text>
  <path d="M610 318 C510 350 390 350 290 318" class="line" marker-end="url(#arrow)"/><text x="405" y="350" font-size="34" class="red">?</text>
  <text x="90" y="340" class="body">More machinery, slower turns, and no clear improvement in solved tasks.</text>
  <rect x="810" y="135" width="330" height="235" rx="18" fill="#fee2e2" stroke="#fca5a5"/><text x="845" y="180" class="label red">Observed result</text><text x="845" y="225" class="body">v15: 5 / 26 solved</text><text x="845" y="255" class="body">v14: 8 / 26 solved</text><text x="845" y="300" class="small">~2× seconds per turn</text>
  <path d="M600 430 L600 475" class="line" marker-end="url(#arrow)"/>
  <rect x="60" y="490" width="1080" height="145" rx="18" class="good"/>
  <text x="90" y="530" class="label">Simple baseline: standard-only loop</text>
  <rect x="100" y="555" width="220" height="48" rx="12" fill="#fff" stroke="#86efac"/><text x="143" y="586" class="label">inspect → edit → test</text>
  <path d="M330 579 H520" class="line" marker-end="url(#arrow)"/><rect x="540" y="555" width="220" height="48" rx="12" fill="#fff" stroke="#86efac"/><text x="590" y="586" class="label">submit or retry</text>
  <path d="M770 579 H950" class="line" marker-end="url(#arrow)"/><text x="970" y="586" font-size="27" class="green">✓</text><text x="1005" y="586" class="small">quick and cheap</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
</svg>
