<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 282" width="640" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">Edit failure rate by edit interface</title>
<desc id="d">Line-range splices failed 55 to 75 percent of the time; LINE#HASH anchors 73 percent (11 of 15); str_replace 0 percent (0 of 8); stubbing old_str in history made 20 percent of later edits (36 of 177) copy the stub.</desc>
<style>
.s{fill:#fcfcfb} .p{fill:#0b0b0b} .q{fill:#52514e} .g{stroke:#e4e3df} .b{fill:#2a78d6} .r{fill:#2a78d6;opacity:.35}
@media (prefers-color-scheme: dark){.s{fill:#1a1a19} .p{fill:#f0efec} .q{fill:#c3c2b7} .g{stroke:#3a3936} .b,.r{fill:#3987e5}}
</style>
<rect class="s" width="100%" height="100%"/>
<text class="p" x="16" y="26" font-size="15" font-weight="600">Edit failure rate by edit interface</text>
<text class="q" x="16" y="45" font-size="12">Share of edits that failed; the in-distribution str_replace never failed</text>
<line class="g" x1="232.0" x2="232.0" y1="60" y2="248" stroke-width="1"/>
<text class="q" x="232.0" y="264" font-size="11" text-anchor="middle">0%</text>
<line class="g" x1="321.0" x2="321.0" y1="60" y2="248" stroke-width="1"/>
<text class="q" x="321.0" y="264" font-size="11" text-anchor="middle">25%</text>
<line class="g" x1="410.0" x2="410.0" y1="60" y2="248" stroke-width="1"/>
<text class="q" x="410.0" y="264" font-size="11" text-anchor="middle">50%</text>
<line class="g" x1="499.0" x2="499.0" y1="60" y2="248" stroke-width="1"/>
<text class="q" x="499.0" y="264" font-size="11" text-anchor="middle">75%</text>
<line class="g" x1="588.0" x2="588.0" y1="60" y2="248" stroke-width="1"/>
<text class="q" x="588.0" y="264" font-size="11" text-anchor="middle">100%</text>
<text class="p" x="16" y="81" font-size="13">Line-range splice</text>
<text class="q" x="16" y="97" font-size="11">refused by syntax check</text>
<rect class="b" x="232" y="72" width="195.8" height="18" rx="3"/>
<rect class="r" x="429.8" y="72" width="69.2" height="18" rx="3"/>
<text class="p" x="505.0" y="85" font-size="12" font-weight="600">55–75%</text>
<text class="p" x="16" y="127" font-size="13">LINE#HASH anchor</text>
<text class="q" x="16" y="143" font-size="11">11 of 15 edits rejected</text>
<rect class="b" x="232" y="118" width="260.9" height="18" rx="3"/>
<text class="p" x="498.9" y="131" font-size="12" font-weight="600">73%</text>
<text class="p" x="16" y="173" font-size="13">str_replace</text>
<text class="q" x="16" y="189" font-size="11">0 of 8 probes failed</text>
<text class="p" x="238.0" y="177" font-size="12" font-weight="600">0%</text>
<text class="p" x="16" y="219" font-size="13">Stubbed old_str in history</text>
<text class="q" x="16" y="235" font-size="11">36 of 177 edits copied the stub</text>
<rect class="b" x="232" y="210" width="72.3" height="18" rx="3"/>
<text class="p" x="310.3" y="223" font-size="12" font-weight="600">20%</text>
</svg>