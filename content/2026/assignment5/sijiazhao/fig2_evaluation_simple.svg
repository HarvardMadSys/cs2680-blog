<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-labelledby="f2s-title f2s-desc" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="f2s-title">Figure 2: a broken grader and run-to-run variance</title><desc id="f2s-desc">A: local evaluation of 25 tasks, 0/25 before the grader was fixed and 11/25 after, with the same patches and no additional model calls. B: repeated leaderboard scores of identical code, Assignment 3 v3 12, 13, 15, 11, 15 of 26 (self-reported) and Assignment 4 v4.9-rb 13, 10, 10 of 26 (saved leaderboard records).</desc><rect width="860" height="300" fill="#ffffff"/><text x="24" y="30" font-size="13.5"><tspan font-weight="bold" fill="#c0632b" font-size="16">A  </tspan><tspan font-weight="bold" fill="#1f2328" font-size="16">Broken grader</tspan></text><text x="24" y="50" font-size="11.5" fill="#c0632b" font-weight="bold" text-anchor="start">LOCAL · 25 TASKS</text><line x1="50" y1="194.5" x2="118" y2="194.5" stroke="#c0632b" stroke-width="3"/><text x="84" y="186" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="middle">0/25</text><text x="84" y="217" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="middle">Before fix</text><rect x="170" y="150.2" width="68" height="45.8" rx="2" fill="#c0632b"/><text x="204" y="140.2" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="middle">11/25</text><text x="204" y="217" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="middle">After fix</text><line x1="40" y1="196" x2="248" y2="196" stroke="#8c959f" stroke-width="1"/><text x="144" y="244" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="middle">Same patches, no additional</text><text x="144" y="262" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="middle">model calls.</text><line x1="282" y1="18" x2="282" y2="262" stroke="#d0d7de" stroke-width="1"/><text x="306" y="30" font-size="13.5"><tspan font-weight="bold" fill="#2f5f8f" font-size="16">B  </tspan><tspan font-weight="bold" fill="#1f2328" font-size="16">Run-to-run variance</tspan></text><text x="306" y="50" font-size="11.5" fill="#2f5f8f" font-weight="bold" text-anchor="start">LEADERBOARD · IDENTICAL CODE, GRADED REPEATEDLY</text><line x1="316" y1="92" x2="316" y2="200" stroke="#e6e8eb" stroke-width="1"/><text x="316" y="218" font-size="12.5" fill="#57606a" font-weight="normal" text-anchor="middle">0</text><line x1="413.3" y1="92" x2="413.3" y2="200" stroke="#e6e8eb" stroke-width="1"/><text x="413.3" y="218" font-size="12.5" fill="#57606a" font-weight="normal" text-anchor="middle">5</text><line x1="510.6" y1="92" x2="510.6" y2="200" stroke="#e6e8eb" stroke-width="1"/><text x="510.6" y="218" font-size="12.5" fill="#57606a" font-weight="normal" text-anchor="middle">10</text><line x1="607.9" y1="92" x2="607.9" y2="200" stroke="#e6e8eb" stroke-width="1"/><text x="607.9" y="218" font-size="12.5" fill="#57606a" font-weight="normal" text-anchor="middle">15</text><line x1="705.2" y1="92" x2="705.2" y2="200" stroke="#e6e8eb" stroke-width="1"/><text x="705.2" y="218" font-size="12.5" fill="#57606a" font-weight="normal" text-anchor="middle">20</text><line x1="822" y1="92" x2="822" y2="200" stroke="#e6e8eb" stroke-width="1"/><text x="822" y="218" font-size="12.5" fill="#57606a" font-weight="normal" text-anchor="middle">26</text><line x1="316" y1="200" x2="822" y2="200" stroke="#8c959f" stroke-width="1"/><text x="569" y="238" font-size="13" fill="#57606a" font-weight="normal" text-anchor="middle">Tasks solved (of 26)</text><text x="316" y="84" font-size="13.5"><tspan font-weight="bold" fill="#1f2328" font-size="13.5">Assignment 3 · v3</tspan><tspan font-weight="normal" fill="#57606a" font-size="12.5">   self-reported, 5 runs: 12, 13, 15, 11, 15</tspan></text><circle cx="549.5" cy="112" r="6.5" fill="#ffffff" stroke="#2f5f8f" stroke-width="2.2"/><circle cx="569" cy="112" r="6.5" fill="#ffffff" stroke="#2f5f8f" stroke-width="2.2"/><circle cx="607.9" cy="104.5" r="6.5" fill="#ffffff" stroke="#2f5f8f" stroke-width="2.2"/><circle cx="530.1" cy="112" r="6.5" fill="#ffffff" stroke="#2f5f8f" stroke-width="2.2"/><circle cx="607.9" cy="119.5" r="6.5" fill="#ffffff" stroke="#2f5f8f" stroke-width="2.2"/><text x="316" y="150" font-size="13.5"><tspan font-weight="bold" fill="#1f2328" font-size="13.5">Assignment 4 · v4.9-rb</tspan><tspan font-weight="normal" fill="#57606a" font-size="12.5">   saved leaderboard records, 3 runs: 13, 10, 10</tspan></text><circle cx="569" cy="176" r="7" fill="#2f5f8f" stroke="#ffffff" stroke-width="1.2"/><circle cx="510.6" cy="168.5" r="7" fill="#2f5f8f" stroke="#ffffff" stroke-width="1.2"/><circle cx="510.6" cy="183.5" r="7" fill="#2f5f8f" stroke="#ffffff" stroke-width="1.2"/><line x1="24" y1="266" x2="836" y2="266" stroke="#d0d7de" stroke-width="1"/><text x="24" y="288" font-size="13.5" fill="#57606a" font-weight="normal" text-anchor="start">Repeated scores show variability; a single run does not establish improvement.</text></svg>
