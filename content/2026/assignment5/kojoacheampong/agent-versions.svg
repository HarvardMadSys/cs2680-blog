<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 604.0" width="680" height="604.0" role="img" font-family="'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>The agent, version by version</title>
<desc>Share of tasks solved by each graded version of the agent, Assignment 2 to 5, in order. A2 (10 provided tasks): 3, then 6 after passing the requirements and interface, unchanged by three more changes; 656 lines. A3 (26 leaderboard tasks): 17 uploads from 7 to 19, the best uploaded twice more for 18 and 15; 3,729 lines. A4 (the same 26 tasks on a self-served model): 1, a grading that did not start, 0, 0, then 6 after sending the reasoning back, 8 with a 75-minute task limit, 3 twice while skipping known gradings, 6, and 8 in each of the last three; 4,091 lines. A5 (89 Terminal-Bench 2.0 tasks): 33, 28 and 30 from an agent rewritten as one general agent of 1,225 lines.</desc>
