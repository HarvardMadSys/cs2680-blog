<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 324" width="680" height="324" role="img" font-family="'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Turns spent looking before acting</title>
<desc>Average turns a task spent looking before its first action, split into environment orientation (listing files, tool versions, build files) and reading the code and files. Assignment 2 · repository tasks, no probe: 1.7 + 11.6 = 13.3 turns over 118 tasks, 59% looked for 10 or more turns. Assignment 3 · repository tasks, with the probe: 1.3 + 12.0 = 13.3 turns over 173 tasks, 62% looked for 10 or more turns. Assignment 5 · Terminal-Bench tasks, no probe: 1.4 + 1.9 = 3.4 turns over 172 tasks, 6% looked for 10 or more turns.</desc>
<rect width="680" height="324" fill="#FFFFFF"/>
<text x="24.0" y="28.0" font-size="13.5" fill="#646A72" text-anchor="start" font-weight="400">Average turns spent looking before a task&#x27;s first action</text>
<rect x="24.0" y="47.0" width="12.0" height="12.0" rx="2" fill="#8C1515"/>
<text x="42.0" y="58.0" font-size="14.5" fill="#3B4147" text-anchor="start" font-weight="400">Environment: files, tools, versions</text>
<rect x="348.2" y="47.0" width="12.0" height="12.0" rx="2" fill="#B9BEC6"/>
<text x="366.2" y="58.0" font-size="14.5" fill="#3B4147" text-anchor="start" font-weight="400">Reading the code and files</text>
<text x="24.0" y="96.0" font-size="15" fill="#3B4147" text-anchor="start" font-weight="400">Assignment 2 · repository tasks, no probe</text>
<text x="656.0" y="96.0" font-size="13.5" fill="#646A72" text-anchor="end" font-weight="400">118 tasks · 59% looked for 10+ turns</text>
<rect x="24.0" y="105.0" width="63.9" height="22.0" rx="0" fill="#8C1515"/>
<path d="M89.9,105.0 H517.4 Q521.4,105.0 521.4,109.0 V123.0 Q521.4,127.0 517.4,127.0 H89.9 Z" fill="#B9BEC6"/>
<text x="31.0" y="121.0" font-size="13.5" fill="#FFFFFF" text-anchor="start" font-weight="600">1.7</text>
<text x="96.9" y="121.0" font-size="13.5" fill="#1E2126" text-anchor="start" font-weight="600">11.6</text>
<text x="529.4" y="121.0" font-size="14" fill="#1E2126" text-anchor="start" font-weight="600">13.3 turns</text>
<text x="24.0" y="158.0" font-size="15" fill="#3B4147" text-anchor="start" font-weight="400">Assignment 3 · repository tasks, with the probe</text>
<text x="656.0" y="158.0" font-size="13.5" fill="#646A72" text-anchor="end" font-weight="400">173 tasks · 62% looked for 10+ turns</text>
<rect x="24.0" y="167.0" width="49.2" height="22.0" rx="0" fill="#8C1515"/>
<path d="M75.2,167.0 H517.0 Q521.0,167.0 521.0,171.0 V185.0 Q521.0,189.0 517.0,189.0 H75.2 Z" fill="#B9BEC6"/>
<text x="31.0" y="183.0" font-size="13.5" fill="#FFFFFF" text-anchor="start" font-weight="600">1.3</text>
<text x="82.2" y="183.0" font-size="13.5" fill="#1E2126" text-anchor="start" font-weight="600">12.0</text>
<text x="529.0" y="183.0" font-size="14" fill="#1E2126" text-anchor="start" font-weight="600">13.3 turns</text>
<text x="24.0" y="220.0" font-size="15" fill="#3B4147" text-anchor="start" font-weight="400">Assignment 5 · Terminal-Bench tasks, no probe</text>
<text x="656.0" y="220.0" font-size="13.5" fill="#646A72" text-anchor="end" font-weight="400">172 tasks · 6% looked for 10+ turns</text>
<rect x="24.0" y="229.0" width="53.8" height="22.0" rx="0" fill="#8C1515"/>
<path d="M79.8,229.0 H145.9 Q149.9,229.0 149.9,233.0 V247.0 Q149.9,251.0 145.9,251.0 H79.8 Z" fill="#B9BEC6"/>
<text x="31.0" y="245.0" font-size="13.5" fill="#FFFFFF" text-anchor="start" font-weight="600">1.4</text>
<text x="86.8" y="245.0" font-size="13.5" fill="#1E2126" text-anchor="start" font-weight="600">1.9</text>
<text x="157.9" y="245.0" font-size="14" fill="#1E2126" text-anchor="start" font-weight="600">3.4 turns</text>
<text x="24.0" y="288.0" font-size="12.5" fill="#646A72" text-anchor="start" font-weight="400">A turn is one model call; a task&#x27;s first action is an edit, an install, a build, a test run or a script.</text>
<text x="24.0" y="307.0" font-size="12.5" fill="#646A72" text-anchor="start" font-weight="400">A2 and A3 differ in more than the probe (harness, prompts, task mix). A5 pools two local runs.</text>
