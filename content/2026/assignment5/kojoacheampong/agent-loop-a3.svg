<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 630" width="680" height="630" role="img" font-family="'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>The Assignment 3 agent loop</title>
<desc>The Assignment 3 agent, submission #18, for one task. Open the task (a scripted repo probe, no model call), then a pass of at most 25 minutes: model call and tool calls (bash, read, edit) until done. done goes through a pre-done gate once a pass; problems found go back to the model. The patch is graded by evaluate(), which returns only a failing count. Zero failing ends the task. Otherwise retry or stop (at most 4 gradings, 6 if close, 56-minute task cap). A retry saves the best patch, then continues the conversation, starts a fresh draw from the task with a map of files, or starts a seeded draw on the expert tier, and the next pass begins. On stop, the best-graded patch is restored and done(k) ends the task. Five tasks run at once.</desc>
<rect width="680" height="630" fill="#FFFFFF"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#646A72"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#8C1515"/></marker></defs>
<text x="24.0" y="22.0" font-size="14" fill="#1E2126" text-anchor="start" font-weight="600">Assignment 3 · one task, final version (#18)</text>
<text x="656.0" y="22.0" font-size="12.5" fill="#646A72" text-anchor="end" font-weight="400">5 tasks at once (the course&#x27;s limit)</text>
<rect x="24" y="40" width="236" height="56" rx="6" fill="#FFFFFF" stroke="#B9BEC6" stroke-width="1.5"/>
<text x="36.0" y="61.0" font-size="14" fill="#1E2126" text-anchor="start" font-weight="600">Open the task</text>
<text x="36.0" y="77.0" font-size="12" fill="#646A72" text-anchor="start" font-weight="400">scripted repo probe, no model call</text>
<rect x="404" y="40" width="236" height="56" rx="6" fill="#FFFFFF" stroke="#B9BEC6" stroke-width="1.5"/>
<text x="416.0" y="61.0" font-size="14" fill="#1E2126" text-anchor="start" font-weight="600">done(k)</text>
<text x="416.0" y="77.0" font-size="12" fill="#646A72" text-anchor="start" font-weight="400">best-graded patch restored first</text>
<polyline points="404,68 262,68" fill="none" stroke="#646A72" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="332" y="62" font-size="12" fill="#3B4147" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">next task</text>
<polyline points="100,96 100,160" fill="none" stroke="#646A72" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="108" y="116" font-size="12" fill="#3B4147" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">system + task prompt</text>
<rect x="24" y="124" width="316" height="284" rx="8" fill="#F4F5F7"/>
<text x="36.0" y="146.0" font-size="13.5" fill="#1E2126" text-anchor="start" font-weight="600">Pass</text>
<text x="328.0" y="146.0" font-size="12" fill="#646A72" text-anchor="end" font-weight="400">at most 25 min</text>
<rect x="40" y="162" width="120" height="64" rx="6" fill="#FFFFFF" stroke="#B9BEC6" stroke-width="1.5"/>
<text x="52.0" y="183.0" font-size="14" fill="#1E2126" text-anchor="start" font-weight="600">Model call</text>
<text x="52.0" y="199.0" font-size="12" fill="#646A72" text-anchor="start" font-weight="400">standard tier,</text>
<text x="52.0" y="215.0" font-size="12" fill="#646A72" text-anchor="start" font-weight="400">or the expert</text>
<rect x="216" y="162" width="108" height="64" rx="6" fill="#FFFFFF" stroke="#B9BEC6" stroke-width="1.5"/>
<text x="228.0" y="183.0" font-size="14" fill="#1E2126" text-anchor="start" font-weight="600">Tools</text>
<text x="228.0" y="199.0" font-size="12" fill="#646A72" text-anchor="start" font-weight="400">bash, read,</text>
<text x="228.0" y="215.0" font-size="12" fill="#646A72" text-anchor="start" font-weight="400">edit</text>
<polyline points="160,184 214,184" fill="none" stroke="#646A72" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="188" y="178" font-size="12" fill="#3B4147" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">calls</text>
<polyline points="216,204 162,204" fill="none" stroke="#646A72" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="188" y="218" font-size="12" fill="#3B4147" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">results</text>
<rect x="40" y="272" width="284" height="64" rx="6" fill="#FFFFFF" stroke="#B9BEC6" stroke-width="1.5"/>
<text x="52.0" y="293.0" font-size="14" fill="#1E2126" text-anchor="start" font-weight="600">Pre-done gate</text>
<text x="52.0" y="309.0" font-size="12" fill="#646A72" text-anchor="start" font-weight="400">once a pass: syntax, imports, nearby</text>
<text x="52.0" y="325.0" font-size="12" fill="#646A72" text-anchor="start" font-weight="400">tests, a test run since the last edit</text>
<polyline points="72,226 72,270" fill="none" stroke="#646A72" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="78" y="253" font-size="12" fill="#3B4147" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">done</text>
<polyline points="136,272 136,228" fill="none" stroke="#8C1515" stroke-width="2" stroke-linejoin="round" marker-end="url(#ahc)"/>
<text x="142" y="253" font-size="12" fill="#3B4147" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">problems found</text>
<text x="36.0" y="362.0" font-size="12" fill="#646A72" text-anchor="start" font-weight="400">No tool call → nudge, at most 3 in a row</text>
<text x="36.0" y="380.0" font-size="12" fill="#646A72" text-anchor="start" font-weight="400">No edit by 45% of the pass → pace nudge</text>
<text x="36.0" y="398.0" font-size="12" fill="#646A72" text-anchor="start" font-weight="400">Over 120k tokens → compact the history</text>
<polyline points="324,304 370,304" fill="none" stroke="#646A72" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="348" y="298" font-size="12" fill="#3B4147" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">patch</text>
<rect x="372" y="272" width="268" height="64" rx="6" fill="#FFFFFF" stroke="#B9BEC6" stroke-width="1.5"/>
<text x="384.0" y="293.0" font-size="14" fill="#1E2126" text-anchor="start" font-weight="600">Grade: evaluate()</text>
<text x="384.0" y="309.0" font-size="12" fill="#646A72" text-anchor="start" font-weight="400">only a count comes back:</text>
<text x="384.0" y="325.0" font-size="12" fill="#646A72" text-anchor="start" font-weight="400">failing / total tests</text>
<polyline points="540,272 540,98" fill="none" stroke="#646A72" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="548" y="190" font-size="12" fill="#3B4147" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">0 failing</text>
<polyline points="470,336 470,362" fill="none" stroke="#8C1515" stroke-width="2" stroke-linejoin="round" marker-end="url(#ahc)"/>
<text x="478" y="353" font-size="12" fill="#3B4147" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">some failing</text>
<rect x="372" y="364" width="268" height="52" rx="6" fill="#FFFFFF" stroke="#B9BEC6" stroke-width="1.5"/>
<text x="384.0" y="385.0" font-size="14" fill="#1E2126" text-anchor="start" font-weight="600">Retry or stop?</text>
<text x="384.0" y="401.0" font-size="12" fill="#646A72" text-anchor="start" font-weight="400">≤ 4 gradings (6 if close), 56-min cap</text>
<polyline points="640,390 656,390 656,68 642,68" fill="none" stroke="#646A72" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="669" y="230" font-size="12" fill="#3B4147" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke" transform="rotate(-90 669 230)">stop</text>
<polyline points="506,416 506,438" fill="none" stroke="#8C1515" stroke-width="2" stroke-linejoin="round"/>
<polyline points="124,438 556,438" fill="none" stroke="#8C1515" stroke-width="2" stroke-linejoin="round"/>
<polyline points="124,438 124,456" fill="none" stroke="#8C1515" stroke-width="2" stroke-linejoin="round" marker-end="url(#ahc)"/>
<polyline points="340,438 340,456" fill="none" stroke="#8C1515" stroke-width="2" stroke-linejoin="round" marker-end="url(#ahc)"/>
<polyline points="556,438 556,456" fill="none" stroke="#8C1515" stroke-width="2" stroke-linejoin="round" marker-end="url(#ahc)"/>
<text x="498" y="432" font-size="12" fill="#3B4147" text-anchor="end" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">retry: best patch saved, then continue_task()</text>
<rect x="24" y="458" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#B9BEC6" stroke-width="1.5"/>
<text x="36.0" y="479.0" font-size="14" fill="#1E2126" text-anchor="start" font-weight="600">Continue</text>
<text x="36.0" y="495.0" font-size="11.5" fill="#646A72" text-anchor="start" font-weight="400">same conversation, plus the</text>
<text x="36.0" y="511.0" font-size="11.5" fill="#646A72" text-anchor="start" font-weight="400">failing count and the diff</text>
<text x="36" y="527" font-size="11.5" fill="#3B4147" font-style="italic">close and still improving</text>
<rect x="240" y="458" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#B9BEC6" stroke-width="1.5"/>
<text x="252.0" y="479.0" font-size="14" fill="#1E2126" text-anchor="start" font-weight="600">Fresh draw</text>
<text x="252.0" y="495.0" font-size="11.5" fill="#646A72" text-anchor="start" font-weight="400">revert to HEAD, restart from</text>
<text x="252.0" y="511.0" font-size="11.5" fill="#646A72" text-anchor="start" font-weight="400">the task and a map of files</text>
<text x="252" y="527" font-size="11.5" fill="#3B4147" font-style="italic">in every other case</text>
<rect x="456" y="458" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#B9BEC6" stroke-width="1.5"/>
<text x="468.0" y="479.0" font-size="14" fill="#1E2126" text-anchor="start" font-weight="600">Seeded draw · expert</text>
<text x="468.0" y="495.0" font-size="11.5" fill="#646A72" text-anchor="start" font-weight="400">new conversation on this tree,</text>
<text x="468.0" y="511.0" font-size="11.5" fill="#646A72" text-anchor="start" font-weight="400">shown its diff and the count</text>
<text x="468" y="527" font-size="11.5" fill="#3B4147" font-style="italic">a close miss, first retry</text>
<polyline points="124,538 124,556" fill="none" stroke="#8C1515" stroke-width="2" stroke-linejoin="round"/>
<polyline points="340,538 340,556" fill="none" stroke="#8C1515" stroke-width="2" stroke-linejoin="round"/>
<polyline points="556,538 556,556" fill="none" stroke="#8C1515" stroke-width="2" stroke-linejoin="round"/>
<polyline points="556,556 12,556 12,194 38,194" fill="none" stroke="#8C1515" stroke-width="2" stroke-linejoin="round" marker-end="url(#ahc)"/>
<text x="340" y="572" font-size="12" fill="#3B4147" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">next pass</text>
<text x="24.0" y="600.0" font-size="12.5" fill="#646A72" text-anchor="start" font-weight="400">Retries run on the expert tier (25–36× the price of standard) while it is affordable:</text>
<text x="24.0" y="618.0" font-size="12.5" fill="#646A72" text-anchor="start" font-weight="400">at most 3 expert passes a task, and none once the run has spent $6.2.</text>
</svg>
