<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-label="A4 closed-loop engine latency progression from E8p to E40k">
  <defs>
    <style>
      text { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1a1f24; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1f24; }
      .subtitle { font-size: 12px; fill: #59636e; }
      .panel-title { font-size: 13.5px; font-weight: 700; fill: #1a1f24; }
      .axis-label { font-size: 12px; font-weight: 600; fill: #3b434d; }
      .tick { font-size: 11px; fill: #59636e; }
      .val { font-size: 11.5px; font-weight: 600; fill: #1a1f24; }
      .val-muted { font-size: 10.5px; fill: #59636e; }
      .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      .note { font-size: 10.5px; fill: #59636e; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="859" height="399" fill="#fcfcfb" rx="10" stroke="#dfddd5" stroke-width="1"/>
  <text class="title" x="26" y="32">A4 · Engine Latency Progression on Closed-Loop Benchmark (26 Clients)</text>
  <text class="subtitle" x="26" y="50">Adding MTP without rebalancing host KV (E17) made latency 32% worse. Rebalancing KV + verify kernels cut time by 39.5%.</text>
  <line x1="76" y1="304.0" x2="826" y2="304.0" stroke="#eceae3" stroke-width="1"/>
  <text class="tick" x="66" y="308.0" text-anchor="end">0 s</text>
  <line x1="76" y1="258.2" x2="826" y2="258.2" stroke="#eceae3" stroke-width="1"/>
  <text class="tick" x="66" y="262.2" text-anchor="end">4 s</text>
  <line x1="76" y1="212.4" x2="826" y2="212.4" stroke="#eceae3" stroke-width="1"/>
  <text class="tick" x="66" y="216.4" text-anchor="end">8 s</text>
  <line x1="76" y1="166.7" x2="826" y2="166.7" stroke="#eceae3" stroke-width="1"/>
  <text class="tick" x="66" y="170.7" text-anchor="end">12 s</text>
  <line x1="76" y1="120.9" x2="826" y2="120.9" stroke="#eceae3" stroke-width="1"/>
  <text class="tick" x="66" y="124.9" text-anchor="end">16 s</text>
  <line x1="76" y1="165.6" x2="826" y2="165.6" stroke="#7a8591" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="val-muted" x="822" y="159.6" text-anchor="end">E8p base: 12.09 s</text>
  <line x1="76" y1="98" x2="76" y2="304" stroke="#3b434d" stroke-width="1.2"/>
  <line x1="76" y1="304" x2="826" y2="304" stroke="#3b434d" stroke-width="1.2"/>
  <text class="axis-label" x="24" y="201.0" text-anchor="middle" transform="rotate(-90 24 201.0)">Seconds per request (lower is better)</text>
  <rect x="93.7" y="165.6" width="48" height="138.4" rx="3" fill="#7a8591" opacity="1.0"/>
  <text class="val mono" x="117.7" y="158.6" text-anchor="middle" style="fill:#1a1f24">12.09</text>
  <text class="val" x="117.7" y="322" text-anchor="middle">E8p</text>
  <text class="val-muted" x="117.7" y="337" text-anchor="middle">base</text>
