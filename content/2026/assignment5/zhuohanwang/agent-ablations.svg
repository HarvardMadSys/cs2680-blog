  <text class="tick" x="680" y="139.27272727272728" text-anchor="end" style="fill:#1a1f24">Temp 0.7 vs 1.0 (F3, n=16)</text>
  <rect x="785.8" y="127.3" width="55.9" height="15" rx="2" fill="#1f6f8b" opacity="0.92"/>
  <text class="val mono" x="846.7" y="139.27272727272728" text-anchor="start" style="fill:#1f6f8b">+2.00</text>
  <text class="tick" x="680" y="162.54545454545456" text-anchor="end" style="fill:#1a1f24">GRADE_FIT (F4, n=16)</text>
  <rect x="785.8" y="150.5" width="34.9" height="15" rx="2" fill="#1f6f8b" opacity="0.92"/>
  <text class="val mono" x="825.7" y="162.54545454545456" text-anchor="start" style="fill:#1f6f8b">+1.25</text>
  <text class="tick" x="680" y="185.8181818181818" text-anchor="end" style="fill:#1a1f24">PN10 reminder (F2, n=16)</text>
  <rect x="785.8" y="173.8" width="31.3" height="15" rx="2" fill="#1f6f8b" opacity="0.92"/>
  <text class="val mono" x="822.1" y="185.8181818181818" text-anchor="start" style="fill:#1f6f8b">+1.12</text>
  <text class="tick" x="680" y="209.0909090909091" text-anchor="end" style="fill:#1a1f24">Cap 46 · L46 (F6, n=54)</text>
  <rect x="785.8" y="197.1" width="26.0" height="15" rx="2" fill="#1f6f8b" opacity="0.92"/>
  <text class="val mono" x="816.8" y="209.0909090909091" text-anchor="start" style="fill:#1f6f8b">+0.93</text>
  <text class="tick" x="680" y="232.36363636363637" text-anchor="end" style="fill:#1a1f24">Priority off (F2, n=16)</text>
  <rect x="782.5" y="220.4" width="3.4" height="15" rx="2" fill="#c0392b" opacity="0.55"/>
  <text class="val mono" x="777.5" y="232.36363636363637" text-anchor="end" style="fill:#c0392b">-0.12</text>
  <text class="tick" x="680" y="255.63636363636363" text-anchor="end" style="fill:#1a1f24">Soft cut 44 · S44 (F6, n=54)</text>
  <rect x="773.8" y="243.6" width="12.0" height="15" rx="2" fill="#c0392b" opacity="0.55"/>
  <text class="val mono" x="768.8" y="255.63636363636363" text-anchor="end" style="fill:#c0392b">-0.43</text>
  <text class="tick" x="680" y="278.9090909090909" text-anchor="end" style="fill:#1a1f24">Compact @ 48K (F3, n=16)</text>
  <rect x="757.9" y="266.9" width="27.9" height="15" rx="2" fill="#c0392b" opacity="0.92"/>
  <text class="val mono" x="752.9" y="278.9090909090909" text-anchor="end" style="fill:#c0392b">-1.00</text>
  <text class="tick" x="680" y="302.1818181818182" text-anchor="end" style="fill:#1a1f24">Temp 0.6 vs 0.7 (F4, n=16)</text>
  <rect x="743.9" y="290.2" width="41.9" height="15" rx="2" fill="#c0392b" opacity="0.92"/>
  <text class="val mono" x="738.9" y="302.1818181818182" text-anchor="end" style="fill:#c0392b">-1.50</text>
  <text class="tick" x="680" y="325.4545454545455" text-anchor="end" style="fill:#1a1f24">Temp 0.3 vs 0.7 (F5, n=16)</text>
  <rect x="733.3" y="313.5" width="52.5" height="15" rx="2" fill="#c0392b" opacity="0.92"/>
  <text class="val mono" x="728.3" y="325.4545454545455" text-anchor="end" style="fill:#c0392b">-1.88</text>
  <text class="tick" x="680" y="348.72727272727275" text-anchor="end" style="fill:#1a1f24">Aggressive CUT (F4, n=16)</text>
  <rect x="722.9" y="336.7" width="62.9" height="15" rx="2" fill="#c0392b" opacity="0.92"/>
  <text class="val mono" x="717.9" y="348.72727272727275" text-anchor="end" style="fill:#c0392b">-2.25</text>
  <text class="note" x="26" y="416">PN10 plotted as +1.12 from removing it in F2 (PN0 = −1.12). Other rejected A4 ideas (on 45-task dev): TEST_GATE −5, PARALLEL=2 −5, LONG200 −4.3.</text>
</svg>
