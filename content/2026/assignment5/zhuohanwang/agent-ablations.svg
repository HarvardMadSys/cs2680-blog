<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" role="img" aria-label="Agent ablations across A3 and A4 showing what helped vs what backfired">
  <defs>
    <style>
      text { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1a1f24; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1f24; }
      .subtitle { font-size: 12px; fill: #59636e; }
      .panel-title { font-size: 13.5px; font-weight: 700; fill: #1a1f24; }
      .axis-label { font-size: 12px; font-weight: 600; fill: #3b434d; }
      .tick { font-size: 11px; fill: #59636e; }
      .val { font-size: 11.5px; font-weight: 600; fill: #1a1f24; }
      .val-muted { font-size: 10.5px; fill: #59636e; }
      .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      .note { font-size: 10.5px; fill: #59636e; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="919" height="429" fill="#fcfcfb" rx="10" stroke="#dfddd5" stroke-width="1"/>
  <text class="title" x="26" y="32">Agent Ablations in A3 (Paired Dev) and A4 (Factorial Design)</text>
  <text class="subtitle" x="26" y="50">Most added workflow stages and tighter compaction hurt solves or cost; lightweight routing, caching, and budget tweaks held up better.</text>
  <text class="panel-title" x="26" y="80">A. A3 paired dev ablations (solved / 23)</text>
  <line x1="200.0" y1="96" x2="200.0" y2="358" stroke="#eceae3" stroke-width="1"/>
  <text class="tick" x="200.0" y="374" text-anchor="middle">0</text>
  <line x1="256.8" y1="96" x2="256.8" y2="358" stroke="#eceae3" stroke-width="1"/>
  <text class="tick" x="256.8" y="374" text-anchor="middle">5</text>
  <line x1="313.6" y1="96" x2="313.6" y2="358" stroke="#eceae3" stroke-width="1"/>
  <text class="tick" x="313.6" y="374" text-anchor="middle">10</text>
  <line x1="370.5" y1="96" x2="370.5" y2="358" stroke="#eceae3" stroke-width="1"/>
  <text class="tick" x="370.5" y="374" text-anchor="middle">15</text>
  <line x1="427.3" y1="96" x2="427.3" y2="358" stroke="#eceae3" stroke-width="1"/>
  <text class="tick" x="427.3" y="374" text-anchor="middle">20</text>
  <line x1="200" y1="96" x2="200" y2="358" stroke="#3b434d" stroke-width="1.2"/>
  <text class="axis-label" x="325.0" y="396" text-anchor="middle">Solved tasks (out of 23 informative tasks)</text>
  <text class="tick" x="192" y="115" text-anchor="end">Stubs @ 70K ($0.72)</text>
  <rect x="200" y="104" width="136.4" height="15" rx="2" fill="#7a8591"/>
  <text class="val mono" x="342.4" y="116" style="fill:#59636e">12</text>
  <text class="tick" x="192" y="134" text-anchor="end" style="fill:#1a1f24;font-weight:600">Notes @ 30K ($1.19)</text>
  <rect x="200" y="123" width="102.3" height="15" rx="2" fill="#c0392b"/>
  <text class="val mono" x="308.3" y="135" style="fill:#c0392b">9</text>
  <text class="tick" x="192" y="165" text-anchor="end">Fresh std ×3 ($0.89)</text>
  <rect x="200" y="154" width="193.2" height="15" rx="2" fill="#7a8591"/>
  <text class="val mono" x="399.2" y="166" style="fill:#59636e">17</text>
  <text class="tick" x="192" y="184" text-anchor="end" style="fill:#1a1f24;font-weight:600">Expert review ($2.93)</text>
  <rect x="200" y="173" width="159.1" height="15" rx="2" fill="#c0392b"/>
  <text class="val mono" x="365.1" y="185" style="fill:#c0392b">14</text>
  <text class="tick" x="192" y="215" text-anchor="end">70 replies / 13m</text>
  <rect x="200" y="204" width="170.5" height="15" rx="2" fill="#7a8591"/>
  <text class="val mono" x="376.5" y="216" style="fill:#59636e">15</text>
  <text class="tick" x="192" y="234" text-anchor="end" style="fill:#1a1f24;font-weight:600">110 replies / 18m</text>
  <rect x="200" y="223" width="159.1" height="15" rx="2" fill="#c0392b"/>
  <text class="val mono" x="365.1" y="235" style="fill:#c0392b">14</text>
  <text class="tick" x="192" y="265" text-anchor="end">Partial, $0.35 ($4.72)</text>
  <rect x="200" y="254" width="193.2" height="15" rx="2" fill="#7a8591"/>
  <text class="val mono" x="399.2" y="266" style="fill:#59636e">17</text>
  <text class="tick" x="192" y="284" text-anchor="end" style="fill:#1a1f24;font-weight:600">Near, $0.60 ($4.02)</text>
  <rect x="200" y="273" width="204.5" height="15" rx="2" fill="#1f6f8b"/>
  <text class="val mono" x="410.5" y="285" style="fill:#1f6f8b">18</text>
  <text class="tick" x="192" y="315" text-anchor="end">Control (mean of 2)</text>
  <rect x="200" y="304" width="187.5" height="15" rx="2" fill="#7a8591"/>
  <text class="val mono" x="393.5" y="316" style="fill:#59636e">16.5</text>
  <text class="tick" x="192" y="334" text-anchor="end" style="fill:#1a1f24;font-weight:600">+ Expert scout</text>
  <rect x="200" y="323" width="210.2" height="15" rx="2" fill="#1f6f8b"/>
