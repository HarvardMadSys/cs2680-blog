  <text class="val-muted" x="713.0" y="347" text-anchor="middle">~976K host KV</text>
  <text class="val-muted mono" x="713.0" y="364" text-anchor="middle" style="fill:#2b7a4b;font-weight:700">10 s wait · 3.5M prefill</text>
  <rect x="86" y="64" width="12" height="12" rx="2" fill="#1f6f8b"/>
  <text class="tick" x="104" y="74" style="fill:#1a1f24;font-weight:600">Solved (% of 25 tasks)</text>
  <rect x="266" y="64" width="12" height="12" rx="2" fill="#cc6b2c"/>
  <text class="tick" x="284" y="74" style="fill:#1a1f24;font-weight:600">Prefix-cache hit rate (%)</text>
  <text class="note" x="26" y="380">E4 tested whether Mamba state slots caused E1's low peak hits (17%); hits dropped to 13% and solves to 12/25, proving KV capacity bound.</text>
</svg>
