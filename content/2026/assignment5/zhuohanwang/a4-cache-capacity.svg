  <rect x="0.5" y="0.5" width="839" height="389" fill="#fcfcfb" rx="10" stroke="#dfddd5" stroke-width="1"/>
  <text class="title" x="26" y="32">A4 · Fixing Working-Set Capacity Before Tuning Speed</text>
  <text class="subtitle" x="26" y="50">Same agent, 25 local tasks. Only once host KV (10 GB ≈ 976K tokens) exceeded the 500–600K active set did thrashing stop.</text>
