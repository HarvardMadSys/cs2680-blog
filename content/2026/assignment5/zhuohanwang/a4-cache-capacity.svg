  <text class="val" x="531.0" y="331" text-anchor="middle">e4 · 2 Mamba states</text>
  <text class="val-muted" x="531.0" y="347" text-anchor="middle">state hypothesis</text>
  <text class="val-muted mono" x="531.0" y="364" text-anchor="middle" style="fill:#59636e;font-weight:500">23 s wait · 12.9M prefill</text>
  <rect x="632.9" y="94" width="160.2" height="220" rx="8" fill="#d9efe2" opacity="0.38"/>
  <rect x="658.0" y="160.8" width="50" height="151.2" rx="3" fill="#1f6f8b"/>
