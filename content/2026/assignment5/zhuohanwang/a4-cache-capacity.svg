  <line x1="76" y1="102" x2="76" y2="312" stroke="#3b434d" stroke-width="1.2"/>
  <line x1="76" y1="312" x2="804" y2="312" stroke="#3b434d" stroke-width="1.2"/>
  <text class="axis-label" x="24" y="207.0" text-anchor="middle" transform="rotate(-90 24 207.0)">Percentage (%)</text>
  <rect x="112.0" y="228.0" width="50" height="84.0" rx="3" fill="#1f6f8b"/>
  <rect x="172.0" y="190.2" width="50" height="121.8" rx="3" fill="#cc6b2c"/>
