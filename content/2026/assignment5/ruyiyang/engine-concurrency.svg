<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 300' width='760' height='300' role='img' aria-label='Engine concurrency' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13'><rect width='760' height='300' fill='#fff'/><text x='40' y='32' font-size='17' fill='#222' text-anchor='start' font-weight='normal'>How many requests the engine runs at once depends on how memory is split</text><text x='40' y='56' font-size='13' fill='#666' text-anchor='start' font-weight='normal'>Same 32 GB card. MTP makes one request faster but takes the slots other requests need</text><text x='216' y='104.0' font-size='13' fill='#222' text-anchor='end' font-weight='normal'>Qwen3.6, original settings</text><rect x='230' y='84' width='279.5' height='30' fill='#c4c3b8'/><text x='519.5454545454545' y='104.0' font-size='13' fill='#666' text-anchor='start' font-weight='normal'>15</text><text x='216' y='154.0' font-size='13' fill='#222' text-anchor='end' font-weight='normal'>Qwen3.6, larger Mamba ratio</text><rect x='230' y='134' width='410.0' height='30' fill='#c4c3b8'/><text x='650.0' y='154.0' font-size='13' fill='#666' text-anchor='start' font-weight='normal'>22</text><text x='216' y='204.0' font-size='13' fill='#222' text-anchor='end' font-weight='normal'>Qwen3.6, MTP on</text><rect x='230' y='184' width='74.5' height='30' fill='#2f6fd6'/><text x='314.54545454545456' y='204.0' font-size='13' fill='#666' text-anchor='start' font-weight='normal'>4</text><text x='216' y='254.0' font-size='13' fill='#222' text-anchor='end' font-weight='normal'>Qwen3.8, official settings</text><rect x='230' y='234' width='205.0' height='30' fill='#c4c3b8'/><text x='445.0' y='254.0' font-size='13' fill='#666' text-anchor='start' font-weight='normal'>11</text></svg>
