<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 210' width='760' height='210' role='img' aria-label='How tasks end' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13'><rect width='760' height='210' fill='#fff'/><text x='40' y='32' font-size='17' fill='#222' text-anchor='start' font-weight='normal'>Tasks the agent finished itself were mostly right; capped ones mostly wrong</text><text x='40' y='56' font-size='13' fill='#666' text-anchor='start' font-weight='normal'>The 38 tasks one local Terminal-Bench run worked on, grouped by how they ended</text><rect x='170' y='72' width='12' height='12' fill='#2f6fd6'/><text x='188' y='83' font-size='13' fill='#666' text-anchor='start' font-weight='normal'>Solved</text><rect x='250' y='72' width='12' height='12' fill='#c4c3b8'/><text x='268' y='83' font-size='13' fill='#666' text-anchor='start' font-weight='normal'>Not solved</text><text x='156' y='122.0' font-size='13' fill='#222' text-anchor='end' font-weight='normal'>Agent called done</text><rect x='170' y='100' width='402.6' height='34' fill='#2f6fd6'/><rect x='572.6' y='100' width='47.4' height='34' fill='#c4c3b8'/><text x='630' y='122.0' font-size='13' fill='#666' text-anchor='start' font-weight='normal'>17/19 solved</text><text x='156' y='184.0' font-size='13' fill='#222' text-anchor='end' font-weight='normal'>Hit the per-task cap</text><rect x='170' y='162' width='94.7' height='34' fill='#2f6fd6'/><rect x='264.7' y='162' width='355.3' height='34' fill='#c4c3b8'/><text x='630' y='184.0' font-size='13' fill='#666' text-anchor='start' font-weight='normal'>4/19 solved</text></svg>
