<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 292' width='760' height='292' role='img' aria-label='Queueing diagram' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13'><rect width='760' height='292' fill='#fff'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#888'/></marker></defs><text x='24' y='32' font-size='15' fill='#222' text-anchor='start' font-weight='600'>Open more tasks than the engine can run, and the rest wait while their clocks keep going</text><rect x='24' y='64' width='210' height='170' rx='8' fill='none' stroke='#888'/><text x='129' y='90' font-size='13' fill='#222' text-anchor='middle' font-weight='600'>Agent: dozens of tasks open</text><rect x='44' y='106' width='24' height='16' rx='3' fill='#c4c3b8'/><rect x='78' y='106' width='24' height='16' rx='3' fill='#c4c3b8'/><rect x='112' y='106' width='24' height='16' rx='3' fill='#c4c3b8'/><rect x='146' y='106' width='24' height='16' rx='3' fill='#c4c3b8'/><rect x='180' y='106' width='24' height='16' rx='3' fill='#c4c3b8'/><rect x='44' y='130' width='24' height='16' rx='3' fill='#c4c3b8'/><rect x='78' y='130' width='24' height='16' rx='3' fill='#c4c3b8'/><rect x='112' y='130' width='24' height='16' rx='3' fill='#c4c3b8'/><rect x='146' y='130' width='24' height='16' rx='3' fill='#c4c3b8'/><rect x='180' y='130' width='24' height='16' rx='3' fill='#c4c3b8'/><rect x='44' y='154' width='24' height='16' rx='3' fill='#c4c3b8'/><rect x='78' y='154' width='24' height='16' rx='3' fill='#c4c3b8'/><rect x='112' y='154' width='24' height='16' rx='3' fill='#c4c3b8'/><rect x='146' y='154' width='24' height='16' rx='3' fill='#c4c3b8'/><rect x='180' y='154' width='24' height='16' rx='3' fill='#c4c3b8'/><rect x='44' y='178' width='24' height='16' rx='3' fill='#c4c3b8'/><rect x='78' y='178' width='24' height='16' rx='3' fill='#c4c3b8'/><rect x='112' y='178' width='24' height='16' rx='3' fill='#c4c3b8'/><rect x='146' y='178' width='24' height='16' rx='3' fill='#c4c3b8'/><rect x='180' y='178' width='24' height='16' rx='3' fill='#c4c3b8'/><text x='129' y='222' font-size='11.5' fill='#666' text-anchor='middle' font-weight='normal'>Each task's clock starts when it opens</text><text x='376' y='112' font-size='13' fill='#222' text-anchor='middle' font-weight='600'>Waiting for the engine</text><rect x='302' y='132' width='18' height='18' rx='3' fill='#2f6fd6' fill-opacity='0.35' stroke='#2f6fd6'/><rect x='328' y='132' width='18' height='18' rx='3' fill='#2f6fd6' fill-opacity='0.35' stroke='#2f6fd6'/><rect x='354' y='132' width='18' height='18' rx='3' fill='#2f6fd6' fill-opacity='0.35' stroke='#2f6fd6'/><rect x='380' y='132' width='18' height='18' rx='3' fill='#2f6fd6' fill-opacity='0.35' stroke='#2f6fd6'/><rect x='406' y='132' width='18' height='18' rx='3' fill='#2f6fd6' fill-opacity='0.35' stroke='#2f6fd6'/><rect x='432' y='132' width='18' height='18' rx='3' fill='#2f6fd6' fill-opacity='0.35' stroke='#2f6fd6'/><text x='376' y='180' font-size='11.5' fill='#666' text-anchor='middle' font-weight='normal'>Time spent here also counts</text><text x='376' y='196' font-size='11.5' fill='#666' text-anchor='middle' font-weight='normal'>against the per-task cap</text><rect x='520' y='64' width='216' height='170' rx='8' fill='none' stroke='#888'/><text x='628' y='90' font-size='13' fill='#222' text-anchor='middle' font-weight='600'>Engine: only a few slots</text><rect x='548' y='110' width='20' height='20' rx='3' fill='#2f6fd6' fill-opacity='0.12' stroke='#2f6fd6'/><rect x='576' y='110' width='20' height='20' rx='3' fill='#2f6fd6' fill-opacity='0.12' stroke='#2f6fd6'/><rect x='604' y='110' width='20' height='20' rx='3' fill='#2f6fd6' fill-opacity='0.12' stroke='#2f6fd6'/><rect x='632' y='110' width='20' height='20' rx='3' fill='#2f6fd6' fill-opacity='0.12' stroke='#2f6fd6'/><rect x='660' y='110' width='20' height='20' rx='3' fill='#2f6fd6' fill-opacity='0.12' stroke='#2f6fd6'/><rect x='688' y='110' width='20' height='20' rx='3' fill='#2f6fd6' fill-opacity='0.12' stroke='#2f6fd6'/><rect x='548' y='138' width='20' height='20' rx='3' fill='#2f6fd6' fill-opacity='0.12' stroke='#2f6fd6'/><rect x='576' y='138' width='20' height='20' rx='3' fill='#2f6fd6' fill-opacity='0.12' stroke='#2f6fd6'/><rect x='604' y='138' width='20' height='20' rx='3' fill='#2f6fd6' fill-opacity='0.12' stroke='#2f6fd6'/><rect x='632' y='138' width='20' height='20' rx='3' fill='#2f6fd6' fill-opacity='0.12' stroke='#2f6fd6'/><rect x='660' y='138' width='20' height='20' rx='3' fill='#2f6fd6' fill-opacity='0.12' stroke='#2f6fd6'/><text x='628' y='196' font-size='11.5' fill='#666' text-anchor='middle' font-weight='normal'>Each request holds a few</text><text x='628' y='212' font-size='11.5' fill='#666' text-anchor='middle' font-weight='normal'>Mamba state slots</text><g fill='none' stroke='#888'><path d='M234 141H292' marker-end='url(#a)'/><path d='M458 141H518' marker-end='url(#a)'/><path d='M628 234V268H129V236' marker-end='url(#a)'/></g><text x='376' y='260' font-size='11.5' fill='#666' text-anchor='middle' font-weight='normal'>The reply comes back; the agent runs a command, then sends the next request</text></svg>
