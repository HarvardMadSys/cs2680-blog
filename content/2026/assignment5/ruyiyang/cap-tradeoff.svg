<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 310' width='760' height='310' role='img' aria-label='A tighter per-task cap halves the run and loses two tasks' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13'><rect width='760' height='310' fill='#fff'/><text x='40' y='32' font-size='17' fill='#222' text-anchor='start' font-weight='normal'>A tighter per-task cap halves the run and loses two tasks</text><text x='40' y='56' font-size='13' fill='#666' text-anchor='start' font-weight='normal'>Bar = end-to-end time of one Terminal-Bench run; right = tasks solved (of 89)</text><text x='700' y='84' font-size='13' fill='#666' text-anchor='end' font-weight='normal'>Solved</text><text x='136' y='116.0' font-size='13' fill='#222' text-anchor='end' font-weight='normal'>No cap</text><rect x='150' y='96' width='430.0' height='30' fill='#c4c3b8'/><text x='590.0' y='116.0' font-size='13' fill='#666' text-anchor='start' font-weight='normal'>127 min</text><text x='700' y='116.0' font-size='13' fill='#222' text-anchor='end' font-weight='normal'>32</text><text x='136' y='168.0' font-size='13' fill='#222' text-anchor='end' font-weight='normal'>30 min</text><rect x='150' y='148' width='308.1' height='30' fill='#c4c3b8'/><text x='468.1102362204724' y='168.0' font-size='13' fill='#666' text-anchor='start' font-weight='normal'>91 min</text><text x='700' y='168.0' font-size='13' fill='#222' text-anchor='end' font-weight='normal'>32</text><text x='136' y='220.0' font-size='13' fill='#222' text-anchor='end' font-weight='normal'>20 min</text><rect x='150' y='200' width='247.2' height='30' fill='#c4c3b8'/><text x='407.1653543307086' y='220.0' font-size='13' fill='#666' text-anchor='start' font-weight='normal'>73 min</text><text x='700' y='220.0' font-size='13' fill='#222' text-anchor='end' font-weight='normal'>31</text><text x='136' y='272.0' font-size='13' fill='#222' text-anchor='end' font-weight='normal'>15 min</text><rect x='150' y='252' width='209.9